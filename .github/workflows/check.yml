name: Check BitBot
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Check generated assets are current
        run: git diff --exit-code -- firmware/main/generated
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-test-results
          path: test-results/
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile ESP32-S3 commissioning firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: firmware
          command: idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: bitbot-commissioning-esp32s3
          path: |
            firmware/build/bitbot.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
            firmware/build/flash_args
